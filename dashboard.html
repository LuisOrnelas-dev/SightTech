<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SightTech — Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');

        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: #050a0f;
            color: #f1f5f9;
            min-height: 100vh;
        }

        /* NAVBAR */
        .navbar {
            position: sticky; top: 0; z-index: 100;
            background: rgba(5,10,15,0.95);
            border-bottom: 1px solid #1a2535;
            backdrop-filter: blur(16px);
            padding: 0.9rem 0;
        }
        .navbar-inner {
            max-width: 1200px; margin: 0 auto;
            padding: 0 1.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
        }
        .navbar-brand {
            font-size: 1.1rem;
            font-weight: 700;
            color: #0ea5e9;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .navbar-brand i { font-size: 1.2rem; }
        .navbar-nav {
            display: flex;
            align-items: center;
            gap: 0.25rem;
            flex-wrap: wrap;
        }
        .nav-item {
            display: flex;
            align-items: center;
            gap: 0.35rem;
            padding: 0.45rem 0.85rem;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 500;
            color: #94a3b8;
            text-decoration: none;
            cursor: pointer;
            background: none;
            border: none;
            font-family: inherit;
            transition: color 0.2s, background 0.2s;
        }
        .nav-item:hover { color: #f1f5f9; background: rgba(255,255,255,0.05); }
        .nav-item.accent { color: #0ea5e9; }
        .user-chip {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            font-size: 0.82rem;
            color: #64748b;
            padding: 0.35rem 0.75rem;
            border: 1px solid #1a2535;
            border-radius: 9999px;
            background: #0d1420;
        }

        .lang-toggle {
            display: flex;
            align-items: center;
            background: #0d1420;
            border: 1px solid #1a2535;
            border-radius: 9999px;
            padding: 0.25rem 0.7rem;
            cursor: pointer;
            transition: border-color 0.25s;
        }
        .lang-toggle:hover { border-color: #0ea5e9; }
        .lang-opt { font-size: 0.78rem; font-weight: 600; color: #475569; padding: 0.1rem 0.3rem; letter-spacing: 0.05em; transition: color 0.2s; }
        .lang-opt.active { color: #0ea5e9; }
        .lang-sep { color: #1a2535; font-size: 0.72rem; user-select: none; }

        /* MAIN */
        .main { max-width: 1200px; margin: 0 auto; padding: 2rem 1.5rem 4rem; }

        .page-title {
            font-size: 1.4rem;
            font-weight: 700;
            color: #f1f5f9;
            margin-bottom: 0.25rem;
            letter-spacing: -0.02em;
        }
        .page-subtitle { font-size: 0.875rem; color: #64748b; margin-bottom: 2rem; }

        /* STATS GRID */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }
        .stats-card {
            background: #0d1420;
            border: 1px solid #1a2535;
            border-radius: 14px;
            padding: 1.5rem;
            display: flex;
            align-items: center;
            gap: 1rem;
            transition: border-color 0.25s, box-shadow 0.25s;
        }
        .stats-card:hover {
            border-color: rgba(14,165,233,0.3);
            box-shadow: 0 0 20px rgba(14,165,233,0.08);
        }
        .stats-icon {
            width: 48px; height: 48px;
            background: rgba(14,165,233,0.1);
            border: 1px solid rgba(14,165,233,0.2);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #0ea5e9;
            font-size: 1.2rem;
            flex-shrink: 0;
        }
        .stats-info { min-width: 0; }
        .stats-number {
            font-size: 1.9rem;
            font-weight: 800;
            color: #0ea5e9;
            line-height: 1;
            letter-spacing: -0.03em;
        }
        .stats-label { font-size: 0.8rem; color: #64748b; margin-top: 0.2rem; font-weight: 500; }

        /* CONTROLS */
        .controls {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            margin-bottom: 1.25rem;
            flex-wrap: wrap;
        }
        .search-wrap {
            display: flex;
            align-items: center;
            background: #0d1420;
            border: 1px solid #1a2535;
            border-radius: 10px;
            padding: 0 0.75rem;
            gap: 0.5rem;
            transition: border-color 0.25s;
            flex: 1;
            max-width: 340px;
        }
        .search-wrap:focus-within { border-color: #0ea5e9; }
        .search-wrap i { color: #475569; font-size: 0.85rem; }
        .search-input {
            flex: 1;
            background: none;
            border: none;
            outline: none;
            color: #f1f5f9;
            font-size: 0.875rem;
            font-family: inherit;
            padding: 0.65rem 0;
        }
        .search-input::placeholder { color: #334155; }

        .btn-refresh {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.65rem 1.2rem;
            background: #0ea5e9;
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 0.875rem;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: background 0.25s, transform 0.2s;
        }
        .btn-refresh:hover { background: #38bdf8; transform: translateY(-1px); }

        /* TABLE CARD */
        .table-card {
            background: #0d1420;
            border: 1px solid #1a2535;
            border-radius: 14px;
            overflow: hidden;
        }
        .table-card-header {
            padding: 1rem 1.5rem;
            border-bottom: 1px solid #1a2535;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .table-card-header h5 {
            font-size: 0.95rem;
            font-weight: 600;
            color: #f1f5f9;
        }
        .table-card-header i { color: #0ea5e9; }

        .table-wrap { overflow-x: auto; }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.875rem;
        }
        thead tr { background: #070f1a; }
        thead th {
            padding: 0.85rem 1.25rem;
            text-align: left;
            font-size: 0.78rem;
            font-weight: 600;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 0.07em;
            white-space: nowrap;
            border-bottom: 1px solid #1a2535;
        }
        tbody tr {
            border-bottom: 1px solid rgba(26,37,53,0.7);
            transition: background 0.2s;
        }
        tbody tr:last-child { border-bottom: none; }
        tbody tr:hover { background: #0f1d2e; }
        td { padding: 0.85rem 1.25rem; color: #cbd5e1; vertical-align: middle; }

        .patient-meta .name { font-weight: 600; color: #f1f5f9; }
        .patient-meta .id   { font-size: 0.75rem; color: #475569; margin-top: 1px; }

        .avatar-sm {
            width: 34px; height: 34px;
            background: rgba(14,165,233,0.12);
            border: 1px solid rgba(14,165,233,0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #0ea5e9;
            font-size: 0.8rem;
            flex-shrink: 0;
        }
        .patient-row { display: flex; align-items: center; gap: 0.75rem; }

        .badge {
            display: inline-flex;
            align-items: center;
            padding: 0.25rem 0.6rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 600;
            color: #fff;
        }
        .severity-0 { background: #059669; }
        .severity-1 { background: #d97706; }
        .severity-2 { background: #ea580c; }
        .severity-3 { background: #dc2626; }
        .severity-4 { background: #7c3aed; }

        .progress-wrap { min-width: 80px; }
        .progress-bar-bg {
            height: 5px; background: #1a2535; border-radius: 3px; overflow: hidden; margin-bottom: 3px;
        }
        .progress-bar-fill { height: 100%; background: #0ea5e9; border-radius: 3px; transition: width 0.5s; }
        .progress-val { font-size: 0.75rem; color: #64748b; }

        .diag-name  { font-weight: 500; color: #cbd5e1; }
        .diag-conf  { font-size: 0.75rem; color: #475569; margin-top: 1px; }
        .date-main  { color: #cbd5e1; }
        .date-time  { font-size: 0.75rem; color: #475569; margin-top: 1px; }

        .action-btns { display: flex; gap: 0.5rem; }
        .btn-action {
            width: 32px; height: 32px;
            border-radius: 8px;
            border: 1px solid #1a2535;
            background: #0f1d2e;
            color: #94a3b8;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            transition: all 0.2s;
        }
        .btn-action:hover { border-color: #0ea5e9; color: #0ea5e9; background: rgba(14,165,233,0.08); }
        .btn-action.download:hover { border-color: #10b981; color: #10b981; background: rgba(16,185,129,0.08); }

        .empty-state {
            padding: 3rem;
            text-align: center;
            color: #475569;
            font-size: 0.9rem;
        }
        .empty-state i { font-size: 2rem; margin-bottom: 0.75rem; display: block; }

        /* MODAL */
        .modal-overlay {
            display: none;
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(4px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }
        .modal-overlay.open { display: flex; }
        .modal {
            background: #0d1420;
            border: 1px solid #1a2535;
            border-radius: 16px;
            max-width: 600px;
            width: 100%;
            max-height: 85vh;
            overflow-y: auto;
            box-shadow: 0 24px 60px rgba(0,0,0,0.6);
        }
        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1.25rem 1.5rem;
            border-bottom: 1px solid #1a2535;
        }
        .modal-header h5 { font-size: 1rem; font-weight: 600; color: #f1f5f9; display: flex; align-items: center; gap: 0.5rem; }
        .modal-header h5 i { color: #0ea5e9; }
        .modal-close {
            background: none; border: none; color: #64748b;
            font-size: 1.1rem; cursor: pointer; padding: 0.25rem;
            border-radius: 6px; transition: color 0.2s;
        }
        .modal-close:hover { color: #f1f5f9; }
        .modal-body { padding: 1.5rem; }
        .modal-footer {
            display: flex;
            justify-content: flex-end;
            gap: 0.75rem;
            padding: 1rem 1.5rem;
            border-top: 1px solid #1a2535;
        }
        .btn-modal-close {
            padding: 0.6rem 1.2rem;
            background: #0f1d2e;
            border: 1px solid #1a2535;
            border-radius: 9px;
            color: #94a3b8;
            font-size: 0.875rem;
            font-weight: 500;
            font-family: inherit;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-modal-close:hover { background: #152133; }
        .btn-modal-dl {
            padding: 0.6rem 1.2rem;
            background: #0ea5e9;
            border: none;
            border-radius: 9px;
            color: #fff;
            font-size: 0.875rem;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-modal-dl:hover { background: #38bdf8; }

        .modal::-webkit-scrollbar { width: 4px; }
        .modal::-webkit-scrollbar-track { background: transparent; }
        .modal::-webkit-scrollbar-thumb { background: #1a2535; border-radius: 4px; }

        @media (max-width: 768px) {
            .navbar-nav { gap: 0; }
            .nav-item span { display: none; }
            .user-chip span { display: none; }
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
            .controls { flex-direction: column; align-items: stretch; }
            .search-wrap { max-width: 100%; }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="navbar-inner">
            <a class="navbar-brand" href="#">
                <i class="fas fa-eye"></i>
                SightTech
            </a>
            <div class="navbar-nav">
                <div class="user-chip">
                    <i class="fas fa-user-md"></i>
                    <span id="userInfo">Dr. Usuario</span>
                </div>
                <a class="nav-item accent" href="app_analysis.html">
                    <i class="fas fa-plus"></i>
                    <span data-i18n="dashNewAnalysis">Nuevo Análisis</span>
                </a>
                <a class="nav-item" href="index.html">
                    <i class="fas fa-home"></i>
                    <span data-i18n="dashHome">Inicio</span>
                </a>
                <button class="nav-item" onclick="logout()">
                    <i class="fas fa-sign-out-alt"></i>
                    <span data-i18n="dashLogout">Cerrar Sesión</span>
                </button>
                <button class="lang-toggle" id="langToggle" onclick="toggleLang()">
                    <span class="lang-opt active" id="langES">ES</span>
                    <span class="lang-sep">|</span>
                    <span class="lang-opt" id="langEN">EN</span>
                </button>
            </div>
        </div>
    </nav>

    <main class="main">
        <div class="page-title" data-i18n="dashHistory">Historial de Pacientes</div>
        <div class="page-subtitle">SightTech — Panel médico</div>

        <!-- Stats -->
        <div class="stats-grid">
            <div class="stats-card">
                <div class="stats-icon"><i class="fas fa-users"></i></div>
                <div class="stats-info">
                    <div class="stats-number" id="totalPatients">—</div>
                    <div class="stats-label" data-i18n="dashTotalPatients">Pacientes Totales</div>
                </div>
            </div>
            <div class="stats-card">
                <div class="stats-icon"><i class="fas fa-eye"></i></div>
                <div class="stats-info">
                    <div class="stats-number" id="totalDiagnoses">—</div>
                    <div class="stats-label" data-i18n="dashDiagnoses">Diagnósticos</div>
                </div>
            </div>
            <div class="stats-card">
                <div class="stats-icon"><i class="fas fa-calendar-day"></i></div>
                <div class="stats-info">
                    <div class="stats-number" id="todayDiagnoses">—</div>
                    <div class="stats-label" data-i18n="dashToday">Hoy</div>
                </div>
            </div>
            <div class="stats-card">
                <div class="stats-icon"><i class="fas fa-chart-line"></i></div>
                <div class="stats-info">
                    <div class="stats-number" id="avgConfidence">—</div>
                    <div class="stats-label" data-i18n="dashAvgConf">Confianza Promedio</div>
                </div>
            </div>
        </div>

        <!-- Controls -->
        <div class="controls">
            <div class="search-wrap">
                <i class="fas fa-search"></i>
                <input type="text" class="search-input" id="searchInput" data-i18n="dashSearch" placeholder="Buscar paciente...">
            </div>
            <button class="btn-refresh" onclick="refreshData()">
                <i class="fas fa-sync-alt"></i>
                <span data-i18n="dashRefresh">Actualizar</span>
            </button>
        </div>

        <!-- Table -->
        <div class="table-card">
            <div class="table-card-header">
                <i class="fas fa-list"></i>
                <h5 data-i18n="dashHistory">Historial de Pacientes</h5>
            </div>
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th data-i18n="dashColPatient">Paciente</th>
                            <th data-i18n="dashColAge">Edad</th>
                            <th data-i18n="dashColDiag">Último Diagnóstico</th>
                            <th data-i18n="dashColSev">Severidad</th>
                            <th data-i18n="dashColConf">Confianza</th>
                            <th data-i18n="dashColDate">Fecha</th>
                            <th data-i18n="dashColActions">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="patientsTable">
                        <tr>
                            <td colspan="7">
                                <div class="empty-state">
                                    <i class="fas fa-spinner fa-spin"></i>
                                    Cargando datos...
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Modal -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <div class="modal-header">
                <h5><i class="fas fa-user"></i> Detalles del Paciente</h5>
                <button class="modal-close" onclick="closeModal()"><i class="fas fa-times"></i></button>
            </div>
            <div class="modal-body" id="patientModalBody"></div>
            <div class="modal-footer">
                <button class="btn-modal-close" onclick="closeModal()">Cerrar</button>
                <button class="btn-modal-dl" id="modalDownloadBtn" onclick="downloadPDF()">
                    <i class="fas fa-download" style="margin-right:0.4rem;"></i>Descargar PDF
                </button>
            </div>
        </div>
    </div>

    <script src="assets/js/i18n.js"></script>
    <script>
        let currentDiagnosisId = null;

        function checkAuth() {
            const isLoggedIn = localStorage.getItem('sighttech_logged_in');
            const username   = localStorage.getItem('sighttech_username');
            if (!isLoggedIn || !username) { window.location.href = 'login.html'; return false; }
            document.getElementById('userInfo').textContent = `Dr. ${username}`;
            return true;
        }

        document.addEventListener('DOMContentLoaded', function() {
            if (!checkAuth()) return;
            loadDashboardData();
        });

        function logout() {
            localStorage.removeItem('sighttech_logged_in');
            localStorage.removeItem('sighttech_username');
            window.location.href = 'login.html';
        }

        const DEMO_DATA = {
            total_patients: 8, total_diagnoses: 12, today_diagnoses: 3, avg_confidence: 92.4,
            recent_diagnoses: [
                { id:1, patient_name:'María González López',  patient_age:58, prediction:'Retinopatía moderada',      confidence:91.2, severity:2, created_at: new Date().toISOString() },
                { id:2, patient_name:'Carlos Mendoza Ruiz',   patient_age:48, prediction:'Sin retinopatía diabética', confidence:95.8, severity:0, created_at: new Date(Date.now()-3600000).toISOString() },
                { id:3, patient_name:'Ana Rodríguez Silva',   patient_age:63, prediction:'Retinopatía severa',        confidence:88.5, severity:3, created_at: new Date(Date.now()-7200000).toISOString() },
                { id:4, patient_name:'Roberto Silva Mora',    patient_age:65, prediction:'Retinopatía proliferativa', confidence:94.1, severity:4, created_at: new Date(Date.now()-86400000).toISOString() },
                { id:5, patient_name:'Laura Martínez Pérez',  patient_age:52, prediction:'Retinopatía leve',          confidence:89.3, severity:1, created_at: new Date(Date.now()-172800000).toISOString() },
                { id:6, patient_name:'José Hernández Cruz',   patient_age:71, prediction:'Retinopatía moderada',      confidence:92.7, severity:2, created_at: new Date(Date.now()-259200000).toISOString() },
                { id:7, patient_name:'Patricia López Vega',   patient_age:44, prediction:'Sin retinopatía diabética', confidence:97.2, severity:0, created_at: new Date(Date.now()-345600000).toISOString() },
                { id:8, patient_name:'Miguel Torres Díaz',    patient_age:67, prediction:'Retinopatía severa',        confidence:86.9, severity:3, created_at: new Date(Date.now()-432000000).toISOString() },
            ]
        };

        async function loadDashboardData() {
            try {
                const response = await fetch('https://api.sighttech.mx/api/dashboard');
                const data = await response.json();
                updateStats(data);
                updatePatientsTable(data.recent_diagnoses);
            } catch (error) {
                console.warn('API no disponible, mostrando datos de demo.');
                updateStats(DEMO_DATA);
                updatePatientsTable(DEMO_DATA.recent_diagnoses);
                const banner = document.createElement('div');
                banner.style.cssText = 'background:rgba(14,165,233,0.08);border:1px solid rgba(14,165,233,0.2);border-radius:10px;padding:0.65rem 1rem;font-size:0.82rem;color:#7dd3fc;margin-bottom:1rem;display:flex;align-items:center;gap:0.5rem;';
                banner.innerHTML = '<i class="fas fa-info-circle"></i> Mostrando datos de demo — el backend no está disponible localmente.';
                document.querySelector('.main').insertBefore(banner, document.querySelector('.stats-grid'));
            }
        }

        function updateStats(data) {
            document.getElementById('totalPatients').textContent  = data.total_patients  || 0;
            document.getElementById('totalDiagnoses').textContent = data.total_diagnoses || 0;
            document.getElementById('todayDiagnoses').textContent = data.today_diagnoses || 0;
            document.getElementById('avgConfidence').textContent  = `${data.avg_confidence || 0}%`;
        }

        function updatePatientsTable(diagnoses) {
            const tbody = document.getElementById('patientsTable');
            if (!diagnoses || diagnoses.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7"><div class="empty-state">
                    <i class="fas fa-inbox"></i>No hay diagnósticos registrados
                </div></td></tr>`;
                return;
            }
            tbody.innerHTML = diagnoses.map(d => `
                <tr>
                    <td>
                        <div class="patient-row">
                            <div class="avatar-sm"><i class="fas fa-user"></i></div>
                            <div class="patient-meta">
                                <div class="name">${d.patient_name}</div>
                                <div class="id">ID: ${d.patient_id ?? d.id}</div>
                            </div>
                        </div>
                    </td>
                    <td>${d.patient_age ?? '—'}</td>
                    <td>
                        <div class="diag-name">${d.prediction}</div>
                        <div class="diag-conf">${d.confidence}% confianza</div>
                    </td>
                    <td><span class="badge severity-${d.severity}">Nivel ${d.severity}</span></td>
                    <td>
                        <div class="progress-wrap">
                            <div class="progress-bar-bg">
                                <div class="progress-bar-fill" style="width:${d.confidence}%"></div>
                            </div>
                            <div class="progress-val">${d.confidence}%</div>
                        </div>
                    </td>
                    <td>
                        <div class="date-main">${new Date(d.created_at).toLocaleDateString()}</div>
                        <div class="date-time">${new Date(d.created_at).toLocaleTimeString()}</div>
                    </td>
                    <td>
                        <div class="action-btns">
                            <button class="btn-action" onclick="viewPatient(${d.id})" title="Ver detalles">
                                <i class="fas fa-eye"></i>
                            </button>
                            <button class="btn-action download" onclick="downloadPatientPDF(${d.id})" title="Descargar PDF">
                                <i class="fas fa-download"></i>
                            </button>
                        </div>
                    </td>
                </tr>
            `).join('');
        }

        function viewPatient(diagnosisId) {
            currentDiagnosisId = diagnosisId;
            document.getElementById('patientModalBody').innerHTML = `
                <div style="text-align:center;padding:2rem;color:#64748b;">
                    <i class="fas fa-spinner fa-spin" style="font-size:1.5rem;color:#0ea5e9;"></i>
                    <p style="margin-top:0.75rem;">Cargando información...</p>
                </div>`;
            document.getElementById('modalOverlay').classList.add('open');
        }

        function closeModal() {
            document.getElementById('modalOverlay').classList.remove('open');
            currentDiagnosisId = null;
        }

        document.getElementById('modalOverlay').addEventListener('click', function(e) {
            if (e.target === this) closeModal();
        });

        function downloadPatientPDF(diagnosisId) {
            window.open(`https://api.sighttech.mx/api/download-pdf/${diagnosisId}`, '_blank');
        }

        function downloadPDF() {
            if (currentDiagnosisId) downloadPatientPDF(currentDiagnosisId);
        }

        document.getElementById('searchInput').addEventListener('input', function(e) {
            const term = e.target.value.toLowerCase();
            document.querySelectorAll('#patientsTable tr').forEach(row => {
                row.style.display = row.textContent.toLowerCase().includes(term) ? '' : 'none';
            });
        });

        function refreshData() { loadDashboardData(); }

        async function generateDemoData() {
            try {
                const response = await fetch('https://api.sighttech.mx/api/generate-demo-data', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' }
                });
                const data = await response.json();
                if (data.success) {
                    alert(`✅ Datos de demo generados exitosamente!\n\nPacientes: ${data.pacientes_creados}\nDiagnósticos: ${data.diagnosticos_creados}`);
                    loadDashboardData();
                } else {
                    alert(`❌ Error: ${data.error}`);
                }
            } catch (error) {
                console.error('Error generando datos de demo:', error);
            }
        }
    </script>
</body>
</html>
