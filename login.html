<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SightTech - Acceso Médico</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');

        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: #050a0f;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 700px; height: 700px;
            background: radial-gradient(circle, rgba(14,165,233,0.09) 0%, transparent 65%);
            pointer-events: none;
        }

        .lang-toggle {
            position: fixed;
            top: 1.25rem; right: 1.5rem;
            display: flex;
            align-items: center;
            background: #0d1420;
            border: 1px solid #1a2535;
            border-radius: 9999px;
            padding: 0.3rem 0.8rem;
            cursor: pointer;
            transition: border-color 0.25s;
            z-index: 100;
        }
        .lang-toggle:hover { border-color: #0ea5e9; }
        .lang-opt { font-size: 0.78rem; font-weight: 600; color: #475569; padding: 0.1rem 0.3rem; letter-spacing: 0.05em; transition: color 0.2s; }
        .lang-opt.active { color: #0ea5e9; }
        .lang-sep { color: #1a2535; font-size: 0.75rem; padding: 0 0.1rem; user-select: none; }

        .login-container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 420px;
            padding: 1.5rem;
        }

        .login-card {
            background: #0d1420;
            border: 1px solid #1a2535;
            border-radius: 20px;
            padding: 2.5rem 2rem;
            box-shadow: 0 24px 60px rgba(0,0,0,0.5);
        }

        .logo-section {
            text-align: center;
            margin-bottom: 2rem;
        }
        .logo-section img {
            width: 72px;
            height: 72px;
            object-fit: contain;
            margin-bottom: 1rem;
        }
        .logo-section h2 {
            font-size: 1.5rem;
            font-weight: 700;
            color: #0ea5e9;
            margin-bottom: 0.35rem;
            letter-spacing: -0.02em;
        }
        .logo-section .subtitle {
            font-size: 0.85rem;
            color: #94a3b8;
        }
        .logo-section .access-label {
            display: inline-block;
            margin-top: 0.75rem;
            font-size: 0.78rem;
            font-weight: 600;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: #475569;
            background: #0f1d2e;
            border: 1px solid #1a2535;
            border-radius: 9999px;
            padding: 0.3rem 0.9rem;
        }

        .form-group { margin-bottom: 1.25rem; }
        .form-label {
            display: block;
            font-size: 0.82rem;
            font-weight: 500;
            color: #94a3b8;
            margin-bottom: 0.5rem;
        }
        .form-label i { margin-right: 0.4rem; color: #0ea5e9; }

        .form-control {
            width: 100%;
            padding: 0.75rem 1rem;
            background: #0a1628;
            border: 1px solid #1a2535;
            border-radius: 10px;
            color: #f1f5f9;
            font-size: 0.9rem;
            font-family: inherit;
            outline: none;
            transition: border-color 0.25s ease, box-shadow 0.25s ease;
        }
        .form-control::placeholder { color: #334155; }
        .form-control:focus {
            border-color: #0ea5e9;
            box-shadow: 0 0 0 3px rgba(14,165,233,0.1);
        }

        .form-check {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
        }
        .form-check input[type="checkbox"] {
            width: 16px; height: 16px;
            accent-color: #0ea5e9;
            cursor: pointer;
        }
        .form-check label {
            font-size: 0.85rem;
            color: #94a3b8;
            cursor: pointer;
        }

        .btn-login {
            width: 100%;
            padding: 0.85rem;
            background: #0ea5e9;
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 0.95rem;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: background 0.25s ease, transform 0.2s ease, box-shadow 0.25s ease;
            box-shadow: 0 4px 20px rgba(14,165,233,0.3);
        }
        .btn-login:hover {
            background: #38bdf8;
            transform: translateY(-2px);
            box-shadow: 0 8px 28px rgba(14,165,233,0.4);
        }

        .alert {
            padding: 0.75rem 1rem;
            border-radius: 10px;
            font-size: 0.875rem;
            margin-bottom: 1.25rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .alert-success { background: rgba(16,185,129,0.1); border: 1px solid rgba(16,185,129,0.3); color: #6ee7b7; }
        .alert-danger  { background: rgba(239,68,68,0.1);  border: 1px solid rgba(239,68,68,0.3);  color: #fca5a5; }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 1.25rem;
            font-size: 0.82rem;
            color: #475569;
            text-decoration: none;
            transition: color 0.25s;
        }
        .back-link:hover { color: #0ea5e9; }
        .back-link i { margin-right: 0.35rem; }
    </style>
</head>
<body>
    <button class="lang-toggle" id="langToggle" onclick="toggleLang()">
        <span class="lang-opt active" id="langES">ES</span>
        <span class="lang-sep">|</span>
        <span class="lang-opt" id="langEN">EN</span>
    </button>

    <div class="login-container">
        <div class="login-card">
            <div class="logo-section">
                <img src="images/sighttec.png" alt="SightTech Logo">
                <h2>SightTech</h2>
                <p class="subtitle" data-i18n="loginSubtitle">Sistema de Detección de Retinopatía Diabética</p>
                <span class="access-label" data-i18n="loginTitle">Acceso Médico</span>
            </div>

            <div id="alertContainer"></div>

            <form id="loginForm">
                <div class="form-group">
                    <label for="username" class="form-label">
                        <i class="fas fa-user-md"></i>
                        <span data-i18n="loginUser">Usuario Médico</span>
                    </label>
                    <input type="text" class="form-control" id="username" name="username" required autocomplete="username">
                </div>

                <div class="form-group">
                    <label for="password" class="form-label">
                        <i class="fas fa-lock"></i>
                        <span data-i18n="loginPass">Contraseña</span>
                    </label>
                    <input type="password" class="form-control" id="password" name="password" required autocomplete="current-password">
                </div>

                <div class="form-check">
                    <input type="checkbox" id="rememberMe">
                    <label for="rememberMe" data-i18n="loginRemember">Recordar sesión</label>
                </div>

                <button type="submit" class="btn-login">
                    <i class="fas fa-sign-in-alt" style="margin-right:0.5rem;"></i>
                    <span data-i18n="loginBtn">Iniciar Sesión</span>
                </button>
            </form>

            <a href="index.html" class="back-link">
                <i class="fas fa-arrow-left"></i>
                <span>Regresar al sitio</span>
            </a>
        </div>
    </div>

    <script src="assets/js/i18n.js"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            if (username === 'doctor' && password === 'sighttech2024') {
                showAlert('✅ Acceso autorizado. Redirigiendo...', 'success');
                localStorage.setItem('sighttech_logged_in', 'true');
                localStorage.setItem('sighttech_username', username);
                setTimeout(() => { window.location.href = 'app_analysis.html'; }, 1000);
            } else {
                showAlert('❌ Credenciales incorrectas. Intente nuevamente.', 'danger');
            }
        });

        function showAlert(message, type) {
            document.getElementById('alertContainer').innerHTML =
                `<div class="alert alert-${type}">${message}</div>`;
        }

        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('username').focus();
        });
    </script>
</body>
</html>
